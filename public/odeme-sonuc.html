<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Rango | Ödeme</title>
    <style>
      :root { color-scheme: light dark; --bg: #f8f7f3; --fg: #1b1b1b; --muted: #5d5d5d; --gold: #a8842a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #080808; --fg: #f3f3f3; --muted: #a6a6a6; --gold: #d4af37; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 420px; padding: 32px 24px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 12px; color: var(--gold); }
      p { margin: 0 0 10px; line-height: 1.5; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Ödeme sayfasından çıktınız</h1>
      <p>Bu pencereyi kapatıp Rango uygulamasına dönün. Ödemenizin sonucu uygulamada birkaç saniye içinde görünecek.</p>
      <p>Web sitesindeyseniz <a href="/randevularim" target="_top">Randevularım</a> sayfasından randevunuzun durumunu görebilirsiniz.</p>
    </main>
    <script src="/odeme-sonuc.js"></script>
  </body>
</html>
