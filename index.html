<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <script>
      (() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const apply = () => {
          let preference = 'system';
          try { preference = localStorage.getItem('hizmet-theme') || 'system'; } catch {}
          const theme = preference === 'light' || preference === 'dark' ? preference : media.matches ? 'dark' : 'light';
          try { localStorage.setItem('hizmet-theme', theme); } catch {}
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#080808' : '#f8f7f3');
        };
        apply();
        window.addEventListener('storage', apply);
      })();
    </script>
    <meta name="description" content="Rango - Randevunun yeni yolu. İzmir'in seçkin kuaför, berber, spa ve güzellik merkezlerinden saniyeler içinde randevu alın." />
