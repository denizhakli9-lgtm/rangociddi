# Rango Android uygulaması: her `main` güncellemesinde GitHub kendi bilgisayarında derler.
# Ayrıntı ve bir kerelik kurulum: MOBIL-REHBERI.md, "Otomatik derleme (GitHub Actions)".
#
# - İmza sırları (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD; aynı sırlar RANGO_ önekiyle de olur) tanımlıysa: Google Play'e yüklenecek imzalı .aab ve telefona
#   kurulabilen imzalı .apk üretilir.
# - Tanımlı değilse: yalnızca deneme için imzasız (debug) .apk üretilir.
# - PLAY_SERVICE_ACCOUNT_JSON da tanımlıysa .aab Google Play'e (varsayılan: dahili test kanalı)
#   kendiliğinden yüklenir; kanal, depo değişkeni PLAY_TRACK ile değiştirilebilir.
# Dosyalar her çalıştırmanın sayfasında "Artifacts" altında 30 gün durur.
name: Android uygulaması

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Paketler
        run: npm ci

      - name: Web derlemesi
        run: npm run build

      - name: Android projesi (simge, açılış ekranı, izinler, sürüm)
        run: |
          # Play yalnızca öncekilerden büyük sürüm kodunu kabul eder; 100000 + çalıştırma numarası
          # elle verilmiş eski kodların (1, 2, 3…) hep üstünde kalır.
          export ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          export ANDROID_VERSION_NAME="1.${GITHUB_RUN_NUMBER}"
          node scripts/android-prepare.mjs
          echo "VERSION_NAME=$ANDROID_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Supabase anahtarı kontrolü
        run: |
          # Yeni (sb_publishable_) anahtar olmalı, eski JWT anahtarı olmamalı (MOBIL-REHBERI.md 3a).
          test "$(grep -l sb_publishable_ dist/assets/index-*.js | wc -l)" -ge 1
          ! grep -q eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 dist/assets/index-*.js

      - name: İmza anahtarı
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RANGO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RANGO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RANGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RANGO_KEY_PASSWORD }}
        run: |
          # Sırlar yapıştırılırken sona eklenen satır sonlarını (Windows: \r\n) at.
          for v in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            val="${!v}"; while [[ "$val" == *$'\n' || "$val" == *$'\r' ]]; do val="${val%?}"; done
            printf -v "$v" '%s' "$val"
          done
          if [ -n "$KEYSTORE_B64" ]; then
            # Half-configured signing must not silently fall back to an unsigned build.
            for v in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!v}" ]; then echo "::error::İmza sırlarından biri boş: $v (MOBIL-REHBERI.md 3b)"; exit 1; fi
            done
            # Windows'ta üretilen metinde satır sonu / boşluk olabilir.
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/upload.jks"
            # Anahtar, şifre ve alias'ı derlemeden önce doğrula; SHA-1'i Play Console'daki
            # "Yükleme anahtarı sertifikası" ile karşılaştırmak için yazdır.
            if ! keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/cert.txt" 2>&1; then
              echo "::error::Keystore açılamadı: şifre ya da alias yanlış, veya ANDROID_KEYSTORE_BASE64 eksik kopyalandı."
              grep -m1 "keytool error" "$RUNNER_TEMP/cert.txt" || true
              exit 1
            fi
            echo "İmza sertifikası:"; grep -E "SHA1:|SHA256:|Owner:|Valid" "$RUNNER_TEMP/cert.txt"
            echo "SIGN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::İmza sırları tanımlı değil; yalnızca deneme (debug) APK üretilecek. Kurulum: MOBIL-REHBERI.md"
          fi

      - name: Derleme
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RANGO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RANGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RANGO_KEY_PASSWORD }}
        run: |
          # Sırlar yapıştırılırken sona eklenen satır sonlarını (Windows: \r\n) at.
          for v in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            val="${!v}"; while [[ "$val" == *$'\n' || "$val" == *$'\r' ]]; do val="${val%?}"; done
            printf -v "$v" '%s' "$val"
          done
          if [ "$SIGN" = "1" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Dosyaları topla
        run: |
          mkdir -p out
          find android/app/build/outputs -name '*.aab' -exec cp {} "out/rango-${VERSION_NAME}.aab" \;
          find android/app/build/outputs -name '*-release.apk' -exec cp {} "out/rango-${VERSION_NAME}.apk" \;
          find android/app/build/outputs -name '*-debug.apk' -exec cp {} "out/rango-${VERSION_NAME}-deneme.apk" \;
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: rango-android-${{ env.VERSION_NAME }}
          path: out/
          retention-days: 30

      - name: Google Play'e yükle
        if: env.SIGN == '1' && github.ref == 'refs/heads/main'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON tanımlı değil: .aab dosyasını Play Console'a elle yükleyin."
            exit 0
          fi
          echo "PLAY_UPLOAD=1" >> "$GITHUB_ENV"

      - uses: r0adkll/upload-google-play@v1
        if: env.PLAY_UPLOAD == '1'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tr.com.rango.app
          releaseFiles: out/*.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
